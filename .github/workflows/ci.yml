name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: uv python install 3.12
      - name: Sync (Linux)
        if: runner.os == 'Linux'
        run: uv sync --group dev
      - name: Sync (Windows, with sensing extras)
        if: runner.os == 'Windows'
        run: uv sync --group dev --extra windows
      - run: uv run ruff check .
      - run: uv run python tools/validate_maps.py
      - run: uv run pytest -q -m "not needs_game"
