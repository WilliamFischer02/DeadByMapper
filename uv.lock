    { name = "psutil" },
    { name = "pydantic" },
    { name = "pyside6-essentials" },
    { name = "rapidfuzz" },
]

[package.optional-dependencies]
ml = [
    { name = "onnxruntime", marker = "sys_platform != 'win32'" },
    { name = "onnxruntime-directml", marker = "sys_platform == 'win32'" },
]
